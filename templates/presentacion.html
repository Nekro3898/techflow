<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechFlow · Defensa del trabajo final</title>
<style>
:root{--blue:#1d4ed8;--ink:#122143;--muted:#52627a;--paper:#fff;--bg:#eaf0f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}button,a,select{font:inherit}button,.toolbar a{border:1px solid #c5d1e4;border-radius:8px;padding:9px 13px;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}button:hover,.toolbar a:hover{background:#e9f0ff}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button:disabled{opacity:.4;cursor:default}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 22px;background:#fff;border-bottom:1px solid #d7e0ef;flex-wrap:wrap}.brand{font-weight:800;color:var(--blue);letter-spacing:-.5px;margin-right:auto;font-size:23px}.toolbar .primary{background:var(--blue);color:white}.stage{max-width:1320px;margin:22px auto;padding:0 20px}.slide{display:none;background:white;border-radius:14px;min-height:650px;padding:42px 54px 26px;box-shadow:0 8px 35px #183a6710;border-top:7px solid var(--blue)}.slide.active{display:flex;flex-direction:column}.section-label{font-size:13px;letter-spacing:2px;color:var(--blue);font-weight:700}.slide h1{font-size:clamp(48px,6vw,82px);letter-spacing:-3px;line-height:1.05;margin:35px 0 12px}.slide h2{font-size:clamp(28px,3.1vw,44px);letter-spacing:-1px;line-height:1.15;margin:16px 0 24px}.content{font-size:clamp(18px,1.8vw,23px);line-height:1.5;flex:1;min-width:0}.content p{margin:14px 0}.content ul{padding-left:26px;margin:20px 0}.content li{margin:20px 0}.lead{font-size:36px;color:var(--blue)}.cover-sub{font-size:22px}.cover-rule{width:100px;height:6px;background:var(--blue);margin:38px 0}.slide:first-child{background:linear-gradient(115deg,#fff 65%,#e3edff);padding-top:70px}.source{font-size:12px;color:var(--muted);border-top:1px solid #e2e8f0;padding-top:12px;margin-top:22px;overflow-wrap:anywhere}.source span{font-weight:700}.caption{font-size:16px!important;color:var(--muted)}.callout{border-left:5px solid var(--blue);padding:12px 20px;background:#eff6ff;font-size:22px}.diagram{display:block;width:100%;height:auto;max-height:440px}.svgtitle{font-size:20px;font-weight:700;fill:#172554}.svgtext{font-size:18px;fill:#334155}table{border-collapse:collapse;width:100%;font-size:19px;line-height:1.4}th{text-align:left;background:#edf3ff;color:#1e40af}th,td{padding:14px 16px;border-bottom:1px solid #dce4ef;vertical-align:top}pre{font-family:Consolas,monospace;font-size:18px;line-height:1.55;background:#122143;color:#e3edff;padding:22px;border-radius:9px;overflow:auto;margin:0;white-space:pre-wrap}code{font-family:inherit}.timeline{padding-left:30px}.timeline li{padding-left:8px;margin:13px 0}.timeline span{display:block;color:var(--muted);font-size:19px}.evidence{display:block;max-width:100%;max-height:400px;object-fit:contain;object-position:left top;border:1px solid #dce4ef}
.bottom{display:flex;align-items:center;gap:12px;max-width:1280px;margin:12px auto;padding:0 20px 20px}.bottom button{min-width:100px}.counter{margin:auto;font-variant-numeric:tabular-nums}.progress{height:4px;background:#d7e0ef}.progress span{display:block;background:var(--blue);height:100%;transition:width .2s}.notes{max-width:1280px;margin:0 auto 24px;background:#fff9e9;border:1px solid #e8cf88;border-radius:9px;padding:20px 24px;font-size:18px;line-height:1.6}.notes h3{margin:0 0 7px;font-size:16px}.notes[hidden],.index[hidden]{display:none}.index{position:fixed;inset:70px 20px 20px auto;width:min(480px,calc(100vw - 40px));z-index:10;background:white;box-shadow:0 8px 50px #12214350;padding:20px;border-radius:10px;overflow:auto}.index button{display:block;width:100%;text-align:left;margin:6px 0;font-size:15px}.help{color:var(--muted);font-size:13px;text-align:center;margin:0 20px 18px}body:fullscreen{overflow:auto;background:var(--bg)}
@media screen and (min-width:761px) and (max-height:850px){
.toolbar{padding:8px 15px;gap:6px}.toolbar button,.toolbar a{font-size:12px;padding:8px}.brand{font-size:18px}.stage{margin:12px auto}.slide{min-height:510px;padding:24px 38px 18px}.slide:first-child{padding-top:40px}.slide h1{font-size:64px;margin-top:25px}.slide h2{font-size:34px;margin:12px 0 18px}.content{font-size:20px;line-height:1.4}.content li{margin:15px 0}.diagram{max-height:300px}.content table{font-size:17px}.content th,.content td{padding:10px 12px}.content pre{font-size:16px;line-height:1.4;padding:16px}.timeline span{font-size:17px}.evidence{max-height:300px}.source{margin-top:14px}.bottom{margin:6px auto;padding-bottom:8px}.help{margin-bottom:8px}.caption{font-size:14px!important}
}
@media(max-width:760px){.stage{padding:0 10px;margin-top:12px}.slide{padding:24px 20px;min-height:570px}.toolbar{padding:10px}.toolbar a,.toolbar button{font-size:13px;padding:8px}.brand{width:100%}.content{font-size:18px}th,td{padding:9px;font-size:15px}pre{font-size:14px}.diagram{min-width:700px}.content:has(.diagram){overflow-x:auto}.notes{margin:10px}.bottom{flex-wrap:wrap}.slide h2{font-size:29px}}
dialog{border:0;border-radius:12px;width:96vw;max-width:1600px;padding:20px;box-shadow:0 10px 80px #12214350}dialog::backdrop{background:#122143bb}dialog .diagram{max-height:78vh;min-width:0;width:100%}#closeDiagram{float:right;margin-bottom:10px}#largeDiagram{clear:both}
@media print{ #diagramDialog{display:none!important}@page{size:A4 landscape;margin:12mm}body{background:white}.toolbar,.bottom,.help,.progress,.notes,.index{display:none!important}.stage{padding:0;margin:0;max-width:none}.slide,.slide.active{display:flex!important;border:0;border-radius:0;box-shadow:none;min-height:0;height:182mm;padding:8mm 10mm;break-after:page;page-break-after:always;overflow:hidden}.slide:last-child{break-after:auto}.slide h1{font-size:50px}.slide h2{font-size:29px;margin:10px 0 15px}.content{font-size:17px;line-height:1.35}.content li{margin:11px 0}.section-label{font-size:11px}.source{font-size:10px;margin-top:10px;padding-top:7px}th,td{font-size:14px;padding:9px}pre{font-size:14px;line-height:1.3;padding:14px}.diagram{max-height:110mm;min-width:0}.timeline span{font-size:16px}.timeline li{margin:10px 0}.evidence{max-height:110mm}.caption{font-size:12px!important}.callout{font-size:17px}}
</style>
</head>
<body>
<header class="toolbar"><span class="brand">TechFlow <small> / Trabajo final</small></span><button id="indexButton" aria-expanded="false" aria-controls="indice">Índice</button><button id="notesButton" aria-pressed="false">Notas del expositor</button><button id="fullscreen">Pantalla completa</button><button id="zoom" hidden>Ampliar diagrama</button><button id="print">Imprimir / PDF</button><a id="download" href="/presentacion/descargar" download>Descargar HTML</a><a id="guide" href="/presentacion/guia">Guía de defensa</a><a id="appLink" href="/" target="_blank" rel="noopener">Abrir aplicación</a></header>
<div class="progress" aria-hidden="true"><span id="progress"></span></div>
<nav id="indice" class="index" hidden aria-label="Índice de diapositivas"></nav>
<dialog id="diagramDialog"><button id="closeDiagram" autofocus>Cerrar diagrama</button><div id="largeDiagram"></div></dialog>
<main id="slides" class="stage"></main>
<footer class="bottom"><button id="previous">← Anterior</button><span id="counter" class="counter" role="status" aria-live="polite"></span><button id="next" class="primary">Siguiente →</button></footer>
<aside id="notes" class="notes" hidden><h3>Guion del expositor</h3><div id="notesText"></div></aside>
<p class="help">← → para avanzar · Inicio / Fin · N para notas · F para pantalla completa · Esc para cerrar el índice</p>
<script id="slideData" type="application/json">{{ diapositivas|tojson }}</script>
<script>
const slides=JSON.parse(document.getElementById('slideData').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('slides').innerHTML=slides.map((s,i)=>`<section class="slide" aria-label="Diapositiva ${i+1}: ${esc(s.title)}"><div class="section-label">${esc(s.area)}</div><${i===0?'h1':'h2'}>${esc(s.title)}</${i===0?'h1':'h2'}><div class="content">${s.body}</div><div class="source"><span>Referencia:</span> ${esc(s.source||'TechFlow · trabajo final integrador')} <span style="float:right">${i+1} / ${slides.length}</span></div></section>`).join('');
$('indice').innerHTML='<strong>Recorrido de la exposición</strong>'+slides.map((s,i)=>`<button data-slide="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</button>`).join('');
let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===current));$('counter').textContent=`${current+1} / ${slides.length}`;$('previous').disabled=current===0;$('next').disabled=current===slides.length-1;$('progress').style.width=`${(current+1)/slides.length*100}%`;$('notesText').textContent=slides[current].notes;$('zoom').hidden=!slides[current].body.includes('<svg ');history.replaceState(null,'',`#diapositiva-${current+1}`);window.scrollTo({top:0,behavior:'instant'});}
function toggleNotes(){const open=$('notes').hidden;$('notes').hidden=!open;$('notesButton').setAttribute('aria-pressed',String(open));}
function closeIndex(){$('indice').hidden=true;$('indexButton').setAttribute('aria-expanded','false');}
$('previous').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('notesButton').onclick=toggleNotes;
$('indexButton').onclick=()=>{const open=$('indice').hidden;$('indice').hidden=!open;$('indexButton').setAttribute('aria-expanded',String(open));};
$('indice').onclick=e=>{const b=e.target.closest('[data-slide]');if(b){show(Number(b.dataset.slide));closeIndex();}};
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{ $('fullscreen').textContent='Usá F11 en el navegador';}}
$('zoom').onclick=()=>{ $('largeDiagram').innerHTML=document.querySelector('.slide.active svg').outerHTML;$('diagramDialog').showModal();};$('closeDiagram').onclick=()=>$('diagramDialog').close();
$('fullscreen').onclick=fullscreen;$('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(k)){e.preventDefault();show(k==='Home'?0:k==='End'?slides.length-1:current+(['ArrowRight','PageDown'].includes(k)?1:-1));}else if(k.toLowerCase()==='n')toggleNotes();else if(k.toLowerCase()==='f')fullscreen();else if(k==='Escape')closeIndex();});
if(location.protocol==='file:'){['download','guide','appLink'].forEach(id=>$(id).hidden=true);}
const requested=Number(location.hash.match(/^#diapositiva-(\d+)$/)?.[1]||1);show(requested-1);
</script>
</body></html>
